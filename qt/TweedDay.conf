# TweedDay colour scheme for qt5ct / qt6ct, part of cosmic-tweedday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> TweedDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#2c2e34, #f6f4f1, #f6f4f1, #d4d2ce, #dfdcd8, #dfdcd8, #2c2e34, #202228, #2c2e34, #f6f4f1, #e9e6e2, #dfdcd8, #76593d, #e9e6e2, #76593d, #a13a2b, #f6f4f1, #e9e6e2, #f6f4f1, #2c2e34, #655f58
disabled_colors=#929295, #f6f4f1, #f6f4f1, #d4d2ce, #dfdcd8, #dfdcd8, #929295, #586350, #929295, #e9e6e2, #e9e6e2, #dfdcd8, #d4d2ce, #586350, #655f58, #655f58, #f6f4f1, #e9e6e2, #f6f4f1, #2c2e34, #d4d2ce
inactive_colors=#2c2e34, #f6f4f1, #f6f4f1, #d4d2ce, #dfdcd8, #dfdcd8, #2c2e34, #202228, #2c2e34, #f6f4f1, #e9e6e2, #dfdcd8, #76593d, #e9e6e2, #76593d, #a13a2b, #f6f4f1, #e9e6e2, #f6f4f1, #2c2e34, #655f58
