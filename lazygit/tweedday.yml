# TweedDay for lazygit, part of cosmic-tweedday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/tweedday.yml and
# zsh/tweedday.zsh sets LG_CONFIG_FILE to "config.yml,tweedday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/tweedday.yml"
gui:
  theme:
    activeBorderColor:
      - "#76593D"
      - bold
    inactiveBorderColor:
      - "#D4D2CE"
    searchingActiveBorderColor:
      - "#A13A2B"
      - bold
    optionsTextColor:
      - "#586350"
    selectedLineBgColor:
      - "#DFDCD8"
    inactiveViewSelectedLineBgColor:
      - "#F6F4F1"
    cherryPickedCommitFgColor:
      - "#E9E6E2"
    cherryPickedCommitBgColor:
      - "#695F3B"
    markedBaseCommitFgColor:
      - "#E9E6E2"
    markedBaseCommitBgColor:
      - "#58644F"
    unstagedChangesColor:
      - "#B32A19"
    defaultFgColor:
      - "#2C2E34"
  authorColors:
    "*": "#695F3B"
