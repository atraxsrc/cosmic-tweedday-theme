# TweedDay for Alacritty, part of cosmic-tweedday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/tweedday.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#E9E6E2"
foreground = "#2C2E34"
bright_foreground = "#202228"
dim_foreground = "#655F58"

[colors.cursor]
text = "#E9E6E2"
cursor = "#76593D"

[colors.vi_mode_cursor]
text = "#E9E6E2"
cursor = "#A13A2B"

[colors.selection]
text = "CellForeground"
background = "#D4D2CE"

[colors.search.matches]
foreground = "#E9E6E2"
background = "#695F3B"

[colors.search.focused_match]
foreground = "#E9E6E2"
background = "#76593D"

[colors.hints.start]
foreground = "#E9E6E2"
background = "#A13A2B"

[colors.hints.end]
foreground = "#E9E6E2"
background = "#695F3B"

[colors.footer_bar]
foreground = "#2C2E34"
background = "#F6F4F1"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#DFDCD8"
red     = "#B32A19"
green   = "#58644F"
yellow  = "#695F3B"
blue    = "#76593D"
magenta = "#A13A2B"
cyan    = "#685D50"
white   = "#59544B"

[colors.bright]
black   = "#929295"
red     = "#8F2214"
green   = "#46503F"
yellow  = "#554D30"
blue    = "#624A33"
magenta = "#812E22"
cyan    = "#6F5D4E"
white   = "#202228"

[colors.dim]
black   = "#E9E6E2"
red     = "#E24531"
green   = "#7B8C6F"
yellow  = "#9D8E58"
blue    = "#58616F"
magenta = "#D05E4E"
cyan    = "#857766"
white   = "#666157"
